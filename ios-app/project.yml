name: CJ
options:
  bundleIdPrefix: com.soothslayer
  deploymentTarget:
    iOS: '17.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: ''
    META_APP_ID: '0'
    CLIENT_TOKEN: ''
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  CJ:
    type: application
    platform: iOS
    sources: [CJ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soothslayer.cj
        INFOPLIST_FILE: CJ/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
  CJTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CJTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CJ
  CJUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CJUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CJ
schemes:
  CJ:
    build:
      targets:
        CJ: all
    test:
      targets: [CJTests, CJUITests]
